<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>miniproyecto</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="h-400">
    <!--   logo -->
    <header class="flex justify-between h-[4%] w-full bg-dark">
      <img src="./imagenes/icons8-reaccionar.svg" class="h-full pl-3" />

      <!-- navigation bar -->
      <nav
        class="text-xs flex flex-row items-center gap-5 text-white font-[roboto]"
      >
        <a href="">ABOUT ME</a><a href="">SKILLS</a><a href="">PROJECTS</a>
      </nav>

      <!-- contacto -->
      <div class="text-xs flex flex-row items-center pr-4 gap-2">
        <div
          class="flex flex-row items-center gap-1 border border-white rounded-2xl h-7"
        >
          <div class="w-15 rounded-2xl text-white pl-2 font-[roboto]">
            <p class="text-[12px]">CONTACT</p>
          </div>
          <div
            class="w-6 h-6 bg-[#e0ef88] active:bg-[#929974] flex items-center justify-center rounded-2xl"
          >
            <a
              href="https://wa.me/595983384955"
              target="_blank"
              class="text-sm rounded-2xl"
              >↗</a
            >
          </div>
        </div>
      </div>
    </header>

    <!-- parte principal con la imagen  -->
    <main
      class="h-[30%] bg-linear-to-t from-[#334c75] to-dark flex flex-col items-center justify-center"
    >
      <!-- parte donde dice mi nombre -->
      <section class="h-[30%] w-full">
        <!-- parte de arriba -->
        <div
          class="flex items-end justify-center h-[50%] font-[roboto] gap-1 text-3xl"
        >
          <p class="text-white">
            I'm <span class="text-[#d3e684]">Eliseo Borja</span>
          </p>
        </div>
        <!-- parte de abajo -->
        <div
          class="h-[50%] flex flex-row justify-center font-[roboto] text-white text-3xl gap-0.5"
        >
          <p class="h-10 w-35 text-center rounded-md border border-white">
            Front End
          </p>
          <p class="h-8">Developer</p>
        </div>
      </section>
      <!-- imagenes y boton de mis proyectos -->
      <section class="h-[68%] w-full">
        <div class="hidden"></div>
        <!-- div imagen -->
        <div
          class="h-full flex flex-col items-center justify-center pl-8 pb-6 relative"
        >
          <img
            src="./imagenes/eliseo-removebg-preview.png"
            alt="Eliseo Borja"
            class="h-90 z-20 drop-shadow-[0px_-12px_20px_#6a7964]"
          />
          <!-- div boton -->
          <div
            class="h-8 w-30 flex items-center justify-center z-40 absolute bottom-2 right-38"
          >
            <a
              href="#projects"
              target="_blank"
              class="h-full w-full text-black text-sm text-center pt-1 font-bold bg-[#e0ef88] rounded-2xl active:bg-[#cce926] border border-black transition duration-100"
            >
              MY PROJECTS
            </a>
          </div>
        </div>
        <div class="hidden"></div>
      </section>
    </main>
    <!-- seccion who am i -->
    <section class="h-[20%] w-full bg-[#0b0f22]">
      <h2 class="text-[#d3e684] uppercase">Who am i?</h2>
    </section>
  </body>
</html>
